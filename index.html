<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f4ed" />
    <meta
      name="description"
      content="Readshelf — keep PDFs and images on your own shelf, private or shared with other readers."
    />
    <title>Readshelf — your reading shelf, shared or private</title>
    <script>
      // Apply the saved theme before the first paint to avoid a flash.
      ;(function () {
        try {
          var saved = localStorage.getItem('readshelf-theme')
          document.documentElement.dataset.theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
